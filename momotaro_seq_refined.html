<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Map &amp; Sequence Diagram</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #0b1220;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --actor: #38bdf8;
    --item: #fbbf24;
    --loc: #34d399;
    --comm: #60a5fa;
    --phys: #f472b6;
    --move: #34d399;
    --state: #a78bfa;
    --appear: #fb923c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  header {
    padding: 10px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  .header-top {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .header-drawer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-width: 0;
  }
  header h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    font-size: 12.5px;
    color: var(--muted);
  }
  .controls label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    user-select: none;
  }
  .btn {
    background: #334155;
    color: #f8fafc;
    border: 1px solid #475569;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .btn:hover { background: #475569; }
  .btn-xs {
    padding: 2px 7px;
    font-size: 11px;
  }
  .mobile-only { display: none; }
  .legend {
    margin-left: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 11px;
  }
  .badge {
    padding: 2px 7px;
    border-radius: 999px;
    font-weight: 600;
    border: 1px solid currentColor;
  }
  .workspace {
    display: flex;
    flex: 1;
    min-height: 0;
  }
  .main-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  .map-section {
    background: #0b1220;
    border-bottom: 2px solid var(--border);
    padding: 8px 14px 10px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }
  .section-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .section-bar strong { color: var(--loc); }
  .map-wrap {
    overflow: auto;
    max-height: 340px;
    border: 1px solid #1e293b;
    border-radius: 8px;
    background: #0f172a;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .diagram-wrap {
    flex: 1;
    overflow: auto;
    padding: 0 16px 12px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .seq-header-sticky {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    width: fit-content;
  }
  .inspector {
    width: 330px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
    font-size: 12.5px;
  }
  .inspector.desktop-hidden { display: none; }
  .sheet-handle {
    display: none;
    width: 38px;
    height: 4px;
    border-radius: 999px;
    background: #475569;
    margin: 8px auto 2px;
    flex-shrink: 0;
  }
  .inspector-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  .inspector-head h2 {
    margin: 0;
    font-size: 13.5px;
    color: var(--actor);
  }
  .inspector-body {
    padding: 12px 14px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .inspector-body h3 {
    margin: 0 0 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .inspector-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 23, 0.6);
    z-index: 110;
  }
  .json-block { margin-bottom: 10px; }
  .json-block summary {
    cursor: pointer;
    color: var(--actor);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 0;
    user-select: none;
  }
  .inspector .sent-box, .inspector textarea {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px;
    line-height: 1.55;
    margin-bottom: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
  }
  .inspector pre {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px;
    overflow: auto;
    font-size: 11px;
    line-height: 1.45;
    color: #cbd5e1;
    margin: 4px 0 0;
  }
  svg text { font-family: inherit; }
  .ev-group { cursor: pointer; }
  .ev-group:hover rect.ev-bg { stroke: #f8fafc; stroke-width: 1.5; }
  .loc-node { cursor: grab; touch-action: none; }
  .loc-node:active { cursor: grabbing; }
  .drop-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    border: 3px dashed var(--actor);
    z-index: 999;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--actor);
  }
  .drop-overlay.active { display: flex; }
  @media (max-width: 900px) {
    header { padding: 8px 10px; gap: 6px; }
    header h1 { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-top { width: 100%; justify-content: space-between; min-width: 0; }
    .header-actions { flex-shrink: 0; }
    .mobile-only { display: inline-flex; align-items: center; }
    .header-drawer { display: none; width: 100%; }
    .header-drawer.open {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }
    .legend { margin-left: 0; }
    .map-hint { display: none; }
    .workspace { flex-direction: column; }
    .main-col { flex: 1; min-height: 0; }
    .map-section { flex: 0 0 var(--map-split, 42%); min-height: 0; padding: 6px 8px; }
    .map-wrap { flex: 1; max-height: none; min-height: 0; }
    .diagram-wrap { flex: 1; min-height: 0; padding: 0 8px 10px; }
    .sheet-handle { display: block; }
    .inspector.desktop-hidden { display: flex; }
    .inspector {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-height: 75vh;
      max-height: 75dvh;
      height: auto;
      z-index: 120;
      border-left: none;
      border-top: 1px solid var(--border);
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.55);
      transform: translateY(105%);
      visibility: hidden;
      pointer-events: none;
      transition: transform 0.2s ease, visibility 0.2s ease;
    }
    .inspector.open {
      transform: translateY(0);
      visibility: visible;
      pointer-events: auto;
    }
    .inspector-backdrop.open { display: block; }
  }
</style>
</head>
<body>
<div class="drop-overlay" id="dropOverlay">JSONL ファイルをドロップして読み込み</div>
<header>
  <div class="header-top">
    <h1>Story Map &amp; Sequence Diagram</h1>
    <div class="header-actions">
      <button class="btn mobile-only" id="toggleMenuBtn" type="button">設定</button>
      <button class="btn" id="toggleInspectorBtn" type="button">詳細</button>
    </div>
  </div>
  <div class="header-drawer" id="headerDrawer">
    <div class="controls">
      <input type="file" id="fileInput" accept=".jsonl,.json,.txt" style="display:none">
      <button class="btn" id="loadFileBtn" type="button">JSONL読込</button>
      <button class="btn" id="togglePasteBtn" type="button">JSONL貼付</button>
      <label><input type="checkbox" id="showItems"> Item レーン表示</label>
      <label><input type="checkbox" id="showLocs"> Location レーン表示</label>
      <label><input type="checkbox" id="showTopic" checked> 台詞/topic 表示</label>
    </div>
    <div class="legend">
      <span class="badge" style="color:var(--comm)">COMMUNICATION</span>
      <span class="badge" style="color:var(--phys)">PHYSICAL_ACTION</span>
      <span class="badge" style="color:var(--move)">MOVEMENT</span>
      <span class="badge" style="color:var(--state)">STATE_CHANGE</span>
      <span class="badge" style="color:var(--appear)">APPEAR</span>
    </div>
  </div>
</header>
<div class="workspace">
  <div class="main-col">
    <section class="map-section">
      <div class="section-bar">
        <span><strong>地図ブロック図</strong><span class="map-hint">（場所ブロック間の線の上部に移動した人物・物を表示 / ブロックはドラッグ移動可）</span></span>
        <span style="display:inline-flex;align-items:center;gap:8px;">
          <span id="mapSummary"></span>
          <button class="btn btn-xs mobile-only" id="cycleSplitBtn" type="button">比率</button>
        </span>
      </div>
      <div class="map-wrap" id="mapWrap"></div>
    </section>
    <div class="diagram-wrap" id="diagramWrap"></div>
  </div>
  <div class="inspector-backdrop" id="inspectorBackdrop"></div>
  <aside class="inspector" id="inspector">
    <div class="sheet-handle"></div>
    <div class="inspector-head">
      <h2 id="inspectorTitle">詳細インスペクタ</h2>
      <button class="btn btn-xs" id="closeInspectorBtn" type="button">閉じる</button>
    </div>
    <div class="inspector-body" id="inspectorBody">
      <p style="color:var(--muted);margin:0;">イベントや移動線をクリック/タップすると、本文と JSON 詳細を表示します。</p>
    </div>
  </aside>
</div>

<script>
let RECORDS = [{"sentence_id": 2, "text": "むかし、むかし、あるところに、おじいさんとおばあさんがありました。", "entities": [{"surface": "おじいさん", "type": "Actor", "resolution": "NEW", "id": "actor_ojiisan", "name": "おじいさん"}, {"surface": "おばあさん", "type": "Actor", "resolution": "NEW", "id": "actor_obaasan", "name": "おばあさん"}, {"surface": "あるところ", "type": "Location", "resolution": "NEW", "id": "loc_somewhere", "name": "あるところ"}], "events": [{"action_type": "APPEAR", "subject": "actor_ojiisan", "inference": "補完", "target": null, "location": "loc_somewhere", "destination": null, "item": null, "topic": null, "description": "存在した"}, {"action_type": "APPEAR", "subject": "actor_obaasan", "inference": "補完", "target": null, "location": "loc_somewhere", "destination": null, "item": null, "topic": null, "description": "存在した"}]}, {"sentence_id": 3, "text": "まいにち、おじいさんは山へしば刈りに、おばあさんは川へ洗濯に行きました。", "entities": [{"surface": "おじいさん", "type": "Actor", "resolution": "EXISTING", "id": "actor_ojiisan", "name": "おじいさん"}, {"surface": "山", "type": "Location", "resolution": "NEW", "id": "loc_mountain", "name": "山"}, {"surface": "おばあさん", "type": "Actor", "resolution": "EXISTING", "id": "actor_obaasan", "name": "おばあさん"}, {"surface": "川", "type": "Location", "resolution": "NEW", "id": "loc_river", "name": "川"}], "events": [{"action_type": "MOVEMENT", "subject": "actor_ojiisan", "inference": "明示", "target": null, "location": "loc_somewhere", "destination": "loc_mountain", "item": null, "topic": null, "description": "芝刈りに向かう"}, {"action_type": "MOVEMENT", "subject": "actor_obaasan", "inference": "明示", "target": null, "location": "loc_somewhere", "destination": "loc_river", "item": null, "topic": null, "description": "洗濯しに行く"}]}, {"sentence_id": 4, "text": "ある日、おばあさんが、川のそばで、せっせと洗濯をしていますと、川上から、大きな桃が一つ、「ドンブラコッコ、スッコッコ。ドンブラコッコ、スッコッコ。」と流れて来ました。", "entities": [{"surface": "おばあさん", "type": "Actor", "resolution": "EXISTING", "id": "actor_obaasan", "name": "おばあさん"}, {"surface": "川のそば", "type": "Location", "resolution": "NEW", "id": "loc_river", "name": "川のそば"}, {"surface": "桃", "type": "Item", "resolution": "NEW", "id": "item_peach", "name": "桃"}], "events": [{"action_type": "PHYSICAL_ACTION", "subject": "actor_obaasan", "inference": "明示", "target": null, "location": "loc_river", "destination": null, "item": null, "topic": null, "description": "洗濯をする"}, {"action_type": "MOVEMENT", "subject": "item_peach", "inference": "補完", "target": null, "location": "loc_river", "destination": "loc_river", "item": "item_peach", "topic": null, "description": "流れてくる"}, {"action_type": "COMMUNICATION", "subject": "item_peach", "inference": "補完", "target": null, "location": "loc_river", "destination": null, "item": "item_peach", "topic": "ドンブラコッコ、スッコッコ。ドンブラコッコ、スッコッコ。", "description": "音を立てて流れる"}]}, {"sentence_id": 5, "text": "「おやおや、これはみごとな桃だこと。おじいさんへのおみやげに、どれどれ、うちへ持って帰りましょう。」", "entities": [{"surface": "桃", "type": "Item", "resolution": "EXISTING", "id": "item_peach", "name": "桃"}, {"surface": "おじいさん", "type": "Actor", "resolution": "EXISTING", "id": "actor_ojiisan", "name": "おじいさん"}, {"surface": "うち", "type": "Location", "resolution": "NEW", "id": "loc_home", "name": "うち"}], "events": [{"action_type": "COMMUNICATION", "subject": "actor_obaasan", "inference": "明示", "target": null, "location": "loc_river", "destination": null, "item": "item_peach", "topic": "おやおや、これはみごとな桃だこと", "description": "感嘆して言う"}, {"action_type": "COMMUNICATION", "subject": "actor_obaasan", "inference": "明示", "target": "actor_ojiisan", "location": "loc_river", "destination": null, "item": null, "topic": "おじいさんへのおみやげに、どれどれ、うちへ持って帰りましょう", "description": "提案する"}]}, {"sentence_id": 6, "text": "おばあさんは、そう言いながら、腰をかがめて桃を取ろうとしましたが、遠くって手がとどきません。", "entities": [{"surface": "おばあさん", "type": "Actor", "resolution": "EXISTING", "id": "actor_obaasan", "name": "おばあさん"}, {"surface": "桃", "type": "Item", "resolution": "EXISTING", "id": "item_peach", "name": "桃"}], "events": [{"action_type": "PHYSICAL_ACTION", "subject": "actor_obaasan", "inference": "明示", "target": nul function rebuildEntityMap() {
  const map = new Map();
  for (const rec of RECORDS) {
    for (const e of (rec.entities || [])) {
      if (!e.id) continue;
      const prev = map.get(e.id);
      if (!prev) {
        map.set(e.id, { id: e.id, type: e.type || "Actor", name: e.name || e.surface || e.id, aliases: [] });
      } else if (e.name && e.name !== prev.name) {
        if (!prev.aliases.includes(prev.name)) prev.aliases.push(prev.name);
        prev.aliases = prev.aliases.filter(a => a !== e.name);
        prev.name = e.name;
      }
    }
  }
  ENTITY_MAP = map;
}

function labelOf(id) {

function escapeXml(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function truncate(str, n) {
  if (!str) return "";

}

function parseJsonlText(text) {
  const out = [];
  for (const rawLine of text.split(/\r?\n/)) {
    const line = rawLine.trim();
    if (!line || !line.startsWith("{")) continue;
    try {
      out.push(JSON.parse(line));

  }
  return out;
}

function extractMovements() {

  for (const rec of RECORDS) {

        const dest = ev.destination && ENTITY_MAP.get(ev.destination)?.type === "Location" ? ev.destination : null;

function buildHierarchyTrees(locIds) {
  const valid = new Set(locIds);
  const parentOf = new Map();
  const childrenOf = new Map();
  for (const id of locIds) childrenOf.set(id, []);
  for (const rel of (HIERARCHY || [])) {
    if (!rel || !valid.has(rel.child) || !valid.has(rel.parent) || rel.child === rel.parent || parentOf.has(rel.child)) {
      continue;
    }
    let cur = rel.parent;
    const seen = new Set([rel.child]);
    while (cur && !seen.has(cur)) {
      seen.add(cur);
      cur = parentOf.get(cur);
    }
    if (cur && seen.has(cur)) continue;
    parentOf.set(rel.child, rel.parent);
    childrenOf.get(rel.parent).push(rel.child);
  }
  const roots = locIds.filter(id => !parentOf.has(id));
  return { parentOf, childrenOf, roots };
}

function measureSubtree(id, childrenOf) {
  const kids = childrenOf.get(id) || [];
  if (kids.length === 0) {
    return { w: 120, h: 48, kids: [] };
  }
  const kidBoxes = kids.map(k => ({ id: k, ...measureSubtree(k, childrenOf) }));
  const GAP_X = 80;
  const PAD_X = 32;
  const PAD_TOP = 64;
  const PAD_BOT = 24;
  const totalKidW = kidBoxes.reduce((s, b) => s + b.w, 0) + Math.max(0, kidBoxes.length - 1) * GAP_X;
  const maxKidH = Math.max(...kidBoxes.map(b => b.h));
  return {
    w: Math.max(180, totalKidW + PAD_X * 2),
    h: maxKidH + PAD_TOP + PAD_BOT,
    kids: kidBoxes
  };
}

function placeSubtree(id, box, x0, y0) {
  if (box.kids.length === 0) {
    LOC_POS.set(id, { x: x0 + box.w / 2, y: y0 + box.h / 2 });
    return;
  }
  // 親コンテナ自身のアンカーは上部ヘッダ中央に置く
  LOC_POS.set(id, { x: x0 + box.w / 2, y: y0 + 22 });
  const GAP_X = 80;
  const PAD_X = 32;
  const PAD_TOP = 64;
  let cx = x0 + PAD_X;
  for (const kb of box.kids) {
    placeSubtree(kb.id, kb, cx, y0 + PAD_TOP);
    cx += kb.w + GAP_X;
  }
}

function ensureLocPositions(locIds) {
  const { childrenOf, roots } = buildHierarchyTrees(locIds);
  const hasHierarchy = (HIERARCHY || []).some(r => locIds.includes(r.child) && locIds.includes(r.parent));
  if (hasHierarchy) {
    let allPlaced = locIds.every(id => LOC_POS.has(id));
    if (!allPlaced) {
      let curX = 40;
      const baseY = 60;
      for (const rootId of roots) {
        const box = measureSubtree(rootId, childrenOf);
        placeSubtree(rootId, box, curX, baseY);
        curX += box.w + 70;
      }
    }
    return;
  }

  const COL_GAP = 250;
  const ROW_GAP = 148;
  const cols = Math.max(3, Math.min(4, locIds.length || 1));
  locIds.forEach((id, i) => {
    if (!LOC_POS.has(id)) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      LOC_POS.set(id, {
        x: 110 + col * COL_GAP + (row % 2 === 1 ? 115 : 0),
        y: 108 + row * ROW_GAP

function computeContainerBoxes(locIds, childrenOf) {
  const boxes = new Map();
  function getBox(id) {
    if (boxes.has(id)) return boxes.get(id);
    const kids = childrenOf.get(id) || [];
    const pos = LOC_POS.get(id);
    if (kids.length === 0) {
      const b = { x1: pos.x - 56, y1: pos.y - 22, x2: pos.x + 56, y2: pos.y + 22, isContainer: false };
      boxes.set(id, b);
      return b;
    }
    const kidBoxes = kids.map(getBox);
    const b = {
      x1: Math.min(...kidBoxes.map(k => k.x1)) - 24,
      y1: Math.min(...kidBoxes.map(k => k.y1)) - 48,
      x2: Math.max(...kidBoxes.map(k => k.x2)) + 24,
      y2: Math.max(...kidBoxes.map(k => k.y2)) + 20,
      isContainer: true
    };

    LOC_POS.set(id, { x: (b.x1 + b.x2) / 2, y: b.y1 + 18 });
    boxes.set(id, b);
    return b;
  }
  for (const id of locIds) getBox(id);
  return boxes;
}

function boxesOverlap(a, b) {
  return !(a.x2 < b.x1 || a.x1 > b.x2 || a.y2 < b.y1 || a.y1 > b.y2);
}

      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="map-arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>`);

  // 0. 親コンテナ枠（包含関係の外枠を背面に描画）
  for (const id of locIds) {
    const cb = containerBoxes.get(id);
    if (!cb || !cb.isContainer) continue;
    const name = truncate(labelOf(id), 14);
    const occ = (occupants.get(id) || []).slice(0, 3).join(", ");
    const hdrText = occ ? `${name} [${occ}]` : name;
    parts.push(`<g class="loc-container">`);
    parts.push(`<rect x="${cb.x1}" y="${cb.y1 + shiftY}" width="${cb.x2 - cb.x1}" height="${cb.y2 - cb.y1}" rx="12" fill="rgba(52, 211, 153, 0.05)" stroke="#34d399" stroke-dasharray="6,3" stroke-width="1.4"/>`);
    parts.push(`<rect x="${cb.x1 + 10}" y="${cb.y1 + shiftY + 6}" width="${Math.max(76, hdrText.length * 10 + 18)}" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>`);
    parts.push(`<text x="${cb.x1 + 18}" y="${cb.y1 + shiftY + 20}" fill="#34d399" font-size="11" font-weight="600">${escapeXml(hdrText)}</text>`);
    parts.push(`</g>`);
  }

  // 1. 矢印線（リーフブロックの背面に描画）
  for (const eg of edgeGeoms) {
    const isHi = SELECTED_EV_ID === eg.tr.refId;
    const stroke = isHi ? "#fbbf24" : "#34d399";
    const marker = isHi ? "url(#map-arrow-hi)" : "url(#map-arrow)";
    parts.push(`<g class="ev-group" onclick="selectEvent(${eg.tr.refId}, true)">`);
    parts.push(`<path d="M ${eg.sx} ${eg.sy + shiftY} Q ${eg.cx} ${eg.cy + shiftY} ${eg.tx} ${eg.ty + shiftY}" fill="none" stroke="${stroke}" stroke-width="${isHi ? 2.6 : 1.8}" marker-end="${marker}"/>`);
    parts.push(`</g>`);
  }

  // 2. リーフ場所ブロック本体
  for (const id of locIds) {
    const cb = containerBoxes.get(id);
    if (cb && cb.isContainer) continue;
    const pos = LOC_POS.get(id);
    const name = truncate(labelOf(id), 10);
    const occ = (occupants.get(id) || []).slice(0, 3).join(", ");
    parts.push(`<g class="loc-node" data-loc-id="${escapeXml(id)}">`);
    parts.push(`<rect x="${pos.x - 56}" y="${pos.y + shiftY - 22}" width="112" height="44" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.6"/>`);
    parts.push(`<text x="${pos.x}" y="${pos.y + shiftY - 2}" text-anchor="middle" fill="#f8fafc" font-size="12.5" font-weight="600">${escapeXml(name)}</text>`);
    parts.push(`<text x="${pos.x}" y="${pos.y + shiftY + 14}" text-anchor="middle" fill="#94a3b8" font-size="9.5">${escapeXml(truncate(occ || id, 16))}</text>`);
    parts.push(`</g>`);
  }

  // 3. 線の上部の移動人物・物ラベル（最前面に描画）
  for (const eg of edgeGeoms) {
    const isHi = SELECTED_EV_ID === eg.tr.refId;
    const stroke = isHi ? "#fbbf24" : "#34d399";
    parts.push(`<g class="ev-group" onclick="selectEvent(${eg.tr.refId}, true)">`);
    parts.push(`<rect x="${eg.peakX - eg.pillW / 2}" y="${eg.peakY + shiftY - 21}" width="${eg.pillW}" height="17" rx="4" fill="#0f172a" stroke="${stroke}" stroke-width="0.9"/>`);
    parts.push(`<text x="${eg.peakX}" y="${eg.peakY + shiftY - 9}" text-anchor="middle" fill="#f8fafc" font-size="10.5" font-weight="600">${renderMoveLabelSpans(eg.tr)}</text>`);
    parts.push(`</g>`);
  }

  parts.push(`</svg>`);
  document.getElementById("mapWrap").innerHTML = parts.join("");
  document.getElementById("mapSummary").textContent = `場所: ${locIds.length} / 場所間の移動線: ${transitions.length}`;
  attachMapDrag();
}

function renderMoveLabelSpans(tr) {
  const prefix = `文${tr.sentenceId}: `;
  const movers = tr.movers || [];
  if (movers.length === 0) {
    return `${escapeXml(prefix)}${escapeXml(truncate(tr.label || "移動", 18))}`;
  }
  const tspans = [`<tspan fill="#cbd5e1">${escapeXml(prefix)}</tspan>`];
  let rem = 18;
  for (let i = 0; i < movers.length; i++) {
    if (rem <= 0) break;
    if (i > 0) {
      if (rem <= 3) {
        tspans.push(`<tspan fill="#94a3b8">…</tspan>`);
        break;
      }
      tspans.push(`<tspan fill="#94a3b8"> / </tspan>`);
      rem -= 3;
    }
    const m = movers[i];
    const part = truncate(m.name, rem);
    const color = TYPE_COLORS[m.type] || "#f8fafc";
    tspans.push(`<tspan fill="${color}">${escapeXml(part)}</tspan>`);
    rem -= part.length;
  }
  return tspans.join("");
}

const MOBILE_BREAKPOINT = 900;
const SPLIT_RATIOS = ["42%", "62%", "24%"];
let splitIdx = 0;

function isMobileViewport() {
  return typeof window !== "undefined" && typeof window.innerWidth === "number" && window.innerWidth <= MOBILE_BREAKPOINT;
}

function updateInspectorToggleLabel() {
  const btn = document.getElementById("toggleInspectorBtn");
  const insp = document.getElementById("inspector");
  if (!btn || !insp) return;
  const isOpen = isMobileViewport()
    ? insp.classList.contains("open")
    : !insp.classList.contains("desktop-hidden");
  btn.textContent = isOpen ? "詳細を閉じる" : "詳細";
}

function openInspector(title) {
  const insp = document.getElementById("inspector");
  const backdrop = document.getElementById("inspectorBackdrop");
  const titleEl = document.getElementById("inspectorTitle");
  if (title && titleEl) titleEl.textContent = title;
  if (insp) {
    insp.classList.remove("desktop-hidden");
    if (isMobileViewport()) insp.classList.add("open");
  }
  if (backdrop && isMobileViewport()) backdrop.classList.add("open");
  updateInspectorToggleLabel();
}

function closeInspector() {
  const insp = document.getElementById("inspector");
  const backdrop = document.getElementById("inspectorBackdrop");
  if (insp) {
    if (isMobileViewport()) {
      insp.classList.remove("open");
    } else {
      insp.classList.add("desktop-hidden");
    }
  }
  if (backdrop) backdrop.classList.remove("open");
  updateInspectorToggleLabel();
}

function getClientPoint(e) {
  if (e.touches && e.touches.length > 0) return e.touches[0];
  if (e.changedTouches && e.changedTouches.length > 0) return e.changedTouches[0];
  return e;
}

function startMapDrag(id, e) {
  const svg = document.getElementById("mapSvg");
  const pos = LOC_POS.get(id);
  if (!svg || !pos) return;
  const p = getClientPoint(e);
  const pt = svg.getBoundingClientRect();
  MAP_DRAG = {
    id,
    offsetX: (p.clientX - pt.left) - pos.x,
    offsetY: (p.clientY - pt.top) - (pos.y + MAP_SHIFT_Y)
  };
  if (e.preventDefault) e.preventDefault();
}

function moveMapDrag(e) {
  if (!MAP_DRAG) return;
  const svg = document.getElementById("mapSvg");
  if (!svg) return;
  if (e.cancelable && e.preventDefault) e.preventDefault();
  const p = getClientPoint(e);
  const pt = svg.getBoundingClientRect();
  LOC_POS.set(MAP_DRAG.id, {
    x: Math.max(70, (p.clientX - pt.left) - MAP_DRAG.offsetX),
    y: Math.max(36, (p.clientY - pt.top) - MAP_SHIFT_Y - MAP_DRAG.offsetY)
  });
  renderMap(extractMovements());
}

function endMapDrag() {
  MAP_DRAG = null;
}

function attachMapDrag() {
  const svg = document.getElementById("mapSvg");
  if (!svg) return;

  svg.querySelectorAll(".loc-node").forEach(node => {
    const id = node.getAttribute("data-loc-id");
    node.addEventListener("mousedown", e => startMapDrag(id, e));
    node.addEventListener("touchstart", e => startMapDrag(id, e), { passive: false });
  });
}

window.addEventListener("mousemove", moveMapDrag);
window.addEventListener("mouseup", endMapDrag);
window.addEventListener("touchmove", moveMapDrag, { passive: false });
window.addEventListener("touchend", endMapDrag);
window.addEventListener("touchcancel", endMapDrag);

function renderSequence() {
  if (RECORDS.length === 0) {
    document.getElementById("diagramWrap").innerHTML = `<div style="padding:24px;color:var(--muted)">左上の「JSONL読込」または「JSONL貼付」（あるいはファイルのドラッグ＆ドロップ）で processor.py の出力を読み込んでください。</div>`;
    return;
  }

  const showItems = document.getElementById("showItems").checked;
  const showLocs = document.getElementById("showLocs").checked;
  const showTopic = document.getElementById("showTopic").checked;

  const usedAsSubject = new Set();
  for (const rec of RECORDS) {
    for (const ev of (rec.events || [])) {
      if (ev.subject) usedAsSubject.add(ev.subject);
    }
  }

  const participants = [];
  for (const [id, ent] of ENTITY_MAP.entries()) {
    if (ent.type === "Actor") {
      participants.push(ent);
    } else if (ent.type === "Item" && (showItems || usedAsSubject.has(id))) {
      participants.push(ent);
    } else if (ent.type === "Location" && showLocs) {
      participants.push(ent);
    }
  }
  const participantIds = new Set(participants.map(p => p.id));
  const hasUnknownSubject = RECORDS.some(rec =>
    (rec.events || []).some(ev => !ev.subject || !participantIds.has(ev.subject))
  );
  if (hasUnknownSubject) {
    participants.push({ id: "_unknown", type: "Unknown", name: "(主語不明/他)", aliases: [] });
  }
  if (participants.length === 0) {
    participants.push({ id: "_narrator", type: "Actor", name: "物語", aliases: [] });
  }

  const mobile = isMobileViewport();
  const colIndex = new Map(participants.map((p, i) => [p.id, i]));
  const LEFT_PAD = mobile ? 20 : 80;
  const COL_W = mobile ? 150 : 185;
  const HEADER_H = 66;
  const ROW_H = 56;
  const SENT_GAP = 24;

  const rows = [];
  let y = HEADER_H + 14;
  for (const rec of RECORDS) {
    const evs = rec.events || [];
    rows.push({ kind: "sentence", rec, y });
    y += SENT_GAP;
    if (evs.length === 0) {
      y += 12;
    } else {
      for (const ev of evs) {
        rows.push({ kind: "event", rec, ev, y });
        y += ROW_H;
      }
    }
  }
  const totalH = y + 36;
  const bodyH = Math.max(120, totalH - HEADER_H);
  const totalW = Math.max(mobile ? 320 : 760, LEFT_PAD + participants.length * COL_W + (mobile ? 20 : 40));

  const headerParts = [];
  headerParts.push(`<div class="seq-header-sticky"><svg xmlns="http://www.w3.org/2000/svg" width="${totalW}" height="${HEADER_H}" viewBox="0 0 ${totalW} ${HEADER_H}" style="display:block">`);

  const parts = [];
  parts.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${totalW}" height="${bodyH}" viewBox="0 ${HEADER_H} ${totalW} ${bodyH}" style="display:block">`);
  parts.push(`<defs>`);
  for (const [atype, color] of Object.entries(ACTION_COLORS)) {
    parts.push(`<marker id="arrow-${atype}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="${color}"/></marker>`);
  }
  parts.push(`</defs>`);

  const firstSeenY = new Map();
  const lastActiveY = new Map();
  const markSeen = (id, rowY) => {
    if (id && colIndex.has(id) && !firstSeenY.has(id)) {
      firstSeenY.set(id, rowY);
    }
  };
  const markActive = (id, endY) => {
    if (id && colIndex.has(id)) {
      lastActiveY.set(id, Math.max(lastActiveY.get(id) || 0, endY));
    }
  };
  for (const row of rows) {
    if (row.kind === "sentence") {
      for (const e of (row.rec.entities || [])) {
        markSeen(e.id, row.y + 10);
      }
    } else {
      const ev = row.ev;
      markSeen(ev.subject, row.y + 10);
      markSeen(ev.target, row.y + 10);
      markSeen(ev.item, row.y + 10);
      markSeen(ev.location, row.y + 10);
      markSeen(ev.destination, row.y + 10);

      // 実際に線・ボックスが接続する列(subject, および矢印終点になる target/destination)のみ終端を更新
      const evEndY = row.y + 34;
      const sCol = colIndex.has(ev.subject)
        ? ev.subject
        : (colIndex.has("_unknown") ? "_unknown" : participants[0].id);
      markActive(sCol, evEndY);
      if (ev.target && colIndex.has(ev.target)) {
        markActive(ev.target, evEndY);
      } else if (ev.destination && colIndex.has(ev.destination)) {
        markActive(ev.destination, evEndY);
      }
    }
  }

  participants.forEach((p, idx) => {
    const cx = LEFT_PAD + idx * COL_W + COL_W / 2;
    const color = TYPE_COLORS[p.type] || "#94a3b8";
    const startY = firstSeenY.has(p.id) ? firstSeenY.get(p.id) : HEADER_H;
    const isInitial = startY <= HEADER_H + 30;
    const lineStartY = isInitial ? HEADER_H : startY;
    const lineEndY = lastActiveY.has(p.id)
      ? Math.max(lineStartY + 14, lastActiveY.get(p.id))
      : lineStartY + 16;

    parts.push(`<line x1="${cx}" y1="${lineStartY}" x2="${cx}" y2="${lineEndY}" stroke="#e2e8f0" stroke-width="2.5"/>`);
    parts.push(`<line x1="${cx - 7}" y1="${lineEndY}" x2="${cx + 7}" y2="${lineEndY}" stroke="#e2e8f0" stroke-width="2.5"/>`);
    if (!isInitial) {
      parts.push(`<circle cx="${cx}" cy="${lineStartY}" r="5" fill="${color}"/>`);
      parts.push(`<rect x="${cx - 48}" y="${lineStartY - 18}" width="96" height="16" rx="4" fill="#0f172a" stroke="${color}" stroke-width="1"/>`);
      parts.push(`<text x="${cx}" y="${lineStartY - 6}" text-anchor="middle" fill="${color}" font-size="9.5" font-weight="600">登場: ${escapeXml(truncate(p.name, 7))}</text>`);
    }
    headerParts.push(`<rect x="${cx - 76}" y="10" width="152" height="44" rx="8" fill="#1e293b" stroke="${color}" stroke-width="1.8"/>`);
    headerParts.push(`<text x="${cx}" y="31" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">${escapeXml(truncate(p.name, 12))}</text>`);
    const sub = p.aliases.length ? `(${truncate(p.aliases.join(","), 14)})` : p.type;
    headerParts.push(`<text x="${cx}" y="47" text-anchor="middle" fill="${color}" font-size="10">${escapeXml(sub)}</text>`);
  });
  headerParts.push(`</svg></div>`);

  let evIdx = 0;
  window.__EVENT_REFS = [];
  for (const row of rows) {
    if (row.kind === "sentence") {
      const ry = row.y;
      parts.push(`<line x1="10" y1="${ry}" x2="${totalW - 10}" y2="${ry}" stroke="#1e293b" stroke-width="1"/>`);
      parts.push(`<text x="14" y="${ry + 15}" fill="#64748b" font-size="11">文${row.rec.sentence_id}: ${escapeXml(truncate(row.rec.text, 75))}</text>`);
    } else {
      const { rec, ev, y: ey } = row;
      const refId = evIdx++;

      const color = ACTION_COLORS[ev.action_type] || "#94a3b8";
      const sId = colIndex.has(ev.subject)
        ? ev.subject
        : (colIndex.has("_unknown") ? "_unknown" : participants[0].id);
      const sIdx = colIndex.get(sId);
      const sx = LEFT_PAD + sIdx * COL_W + COL_W / 2;

      const tId = ev.target && colIndex.has(ev.target)
        ? ev.target
        : (ev.destination && colIndex.has(ev.destination) ? ev.destination : null);
      const tx = tId ? (LEFT_PAD + colIndex.get(tId) * COL_W + COL_W / 2) : null;

      window.__EVENT_REFS.push({
        rec,
        ev,
        y: ey,
        x: (tx !== null && tx !== sx) ? (sx + tx) / 2 : sx,
        headerH: HEADER_H
      });

      let label = ev.description || ev.action_type;
      const extras = [];
      if (ev.item && !colIndex.has(ev.item)) extras.push(`📦${labelOf(ev.item)}`);
      if (ev.destination && !colIndex.has(ev.destination)) extras.push(`➡${labelOf(ev.destination)}`);
      else if (ev.location && !colIndex.has(ev.location)) extras.push(`@${labelOf(ev.location)}`);
      if (showTopic && ev.topic) extras.push(`「${truncate(ev.topic, 18)}」`);
      const fullText = extras.length ? `${truncate(label, 22)} ${extras.join(" ")}` : truncate(label, 34);

      const isHi = SELECTED_EV_ID === refId;
      const midY = ey + 27;
      parts.push(`<g class="ev-group" data-ev-id="${refId}" onclick="selectEvent(${refId}, false)">`);
      if (tx !== null && tx !== sx) {
        const dir = tx > sx ? 1 : -1;
        const x1 = sx + dir * 6;
        const x2 = tx - dir * 6;
        const midX = (x1 + x2) / 2;
        const dash = ev.action_type === "MOVEMENT" ? ' stroke-dasharray="6,4"' : "";
        parts.push(`<line x1="${x1}" y1="${midY}" x2="${x2}" y2="${midY}" stroke="${color}" stroke-width="${isHi ? 3 : 2}"${dash} marker-end="url(#arrow-${ev.action_type})"/>`);
        const boxW = Math.min(Math.abs(x2 - x1) + 40, Math.max(120, fullText.length * 10 + 16));
        parts.push(`<rect class="ev-bg" x="${midX - boxW / 2}" y="${midY - 22}" width="${boxW}" height="18" rx="4" fill="#0f172a" stroke="${isHi ? "#fbbf24" : "#334155"}" stroke-width="${isHi ? 1.5 : 0.8}"/>`);
        parts.push(`<text x="${midX}" y="${midY - 9}" text-anchor="middle" fill="#e2e8f0" font-size="11">${escapeXml(fullText)}</text>`);
      } else {
        const boxW = Math.min(240, Math.max(110, fullText.length * 10 + 20));
        parts.push(`<rect class="ev-bg" x="${sx - boxW / 2}" y="${ey + 7}" width="${boxW}" height="34" rx="6" fill="#1e293b" stroke="${isHi ? "#fbbf24" : color}" stroke-width="${isHi ? 2 : 1.3}"/>`);
        parts.push(`<text x="${sx}" y="${ey + 22}" text-anchor="middle" fill="${color}" font-size="9.5" font-weight="600">${escapeXml(ev.action_type)}${ev.inference === "補完" ? " (補完)" : ""}</text>`);
        parts.push(`<text x="${sx}" y="${ey + 35}" text-anchor="middle" fill="#f1f5f9" font-size="11">${escapeXml(fullText)}</text>`);
      }
      parts.push(`</g>`);
    }
  }

  parts.push(`</svg>`);
  document.getElementById("diagramWrap").innerHTML = headerParts.join("") + parts.join("");
}

function renderAll() {
  rebuildEntityMap();
  const locData = extractMovements();
  renderMap(locData);
  renderSequence();
}

function selectEvent(idx, scrollToSeq = false) {
  const mapWrap = document.getElementById("mapWrap");
  const wrap = document.getElementById("diagramWrap");
  const prevMapTop = mapWrap ? mapWrap.scrollTop : 0;
  const prevMapLeft = mapWrap ? mapWrap.scrollLeft : 0;
  const prevSeqTop = wrap ? wrap.scrollTop : 0;
  const prevSeqLeft = wrap ? wrap.scrollLeft : 0;

  SELECTED_EV_ID = idx;
  renderMap(extractMovements());
  renderSequence();

  if (mapWrap) {
    mapWrap.scrollTop = prevMapTop;
    mapWrap.scrollLeft = prevMapLeft;
  }

  const item = window.__EVENT_REFS[idx];
  if (!item) return;

  if (wrap) {
    if (scrollToSeq) {
      const visibleH = Math.max(80, wrap.clientHeight - item.headerH);
      const targetTop = Math.max(0, (item.y + 27) - item.headerH - visibleH / 2);
      const targetLeft = Math.max(0, (item.x + 16) - wrap.clientWidth / 2);
      wrap.scrollTo({ top: targetTop, left: targetLeft, behavior: "smooth" });
    } else {
      wrap.scrollTop = prevSeqTop;
      wrap.scrollLeft = prevSeqLeft;
    }
  }

  const { rec, ev } = item;
  const bodyEl = document.getElementById("inspectorBody");
  if (bodyEl) {
    const ents = rec.entities || [];
    bodyEl.innerHTML = `
      <h3>本文</h3>
      <div class="sent-box">${escapeXml(rec.text)}</div>
      <details class="json-block" open>
        <summary>イベント JSON</summary>
        <pre>${escapeXml(JSON.stringify(ev, null, 2))}</pre>
      </details>
      <details class="json-block">
        <summary>この文の実体 JSON (${ents.length})</summary>
        <pre>${escapeXml(JSON.stringify(ents, null, 2))}</pre>
      </details>
    `;
  }
  openInspector(`文 ${rec.sentence_id} の詳細`);
}

function onDataLoaded() {
  LOC_POS = new Map();
  SELECTED_EV_ID = null;
  renderAll();
  const drawer = document.getElementById("headerDrawer");
  if (drawer) drawer.classList.remove("open");
  if (isMobileViewport()) closeInspector();
}

function loadJsonlString(text) {
  const trimmed = text.trim();
  if (trimmed.startsWith("{")) {
    try {
      const obj = JSON.parse(trimmed);
      if (obj && Array.isArray(obj.records)) {
        RECORDS = obj.records;
        HIERARCHY = (obj.map && Array.isArray(obj.map.hierarchy)) ? obj.map.hierarchy : [];
        onDataLoaded();
        return;
      }
    } catch (_) {}
  }
  const recs = parseJsonlText(text);
  if (recs.length === 0) {
    alert("有効な JSON Lines が見つかりませんでした。");
    return;
  }
  RECORDS = recs;
  HIERARCHY = [];
  onDataLoaded();
}

});

document.getElementById("closeInspectorBtn").addEventListener("click", closeInspector);
document.getElementById("inspectorBackdrop").addEventListener("click", closeInspector);
document.getElementById("toggleInspectorBtn").addEventListener("click", () => {
  const insp = document.getElementById("inspector");
  if (!insp) return;
  const isOpen = isMobileViewport()
    ? insp.classList.contains("open")
    : !insp.classList.contains("desktop-hidden");
  if (isOpen) {
    closeInspector();
  } else {
    openInspector();
  }
});
document.getElementById("toggleMenuBtn").addEventListener("click", () => {
  const drawer = document.getElementById("headerDrawer");
  if (drawer) drawer.classList.toggle("open");
});
document.getElementById("cycleSplitBtn").addEventListener("click", () => {
  splitIdx = (splitIdx + 1) % SPLIT_RATIOS.length;
  document.documentElement.style.setProperty("--map-split", SPLIT_RATIOS[splitIdx]);
});
window.addEventListener("keydown", e => {
  if (e.key === "Escape") closeInspector();
});
let lastMobileState = isMobileViewport();
window.addEventListener("resize", () => {
  const curMobile = isMobileViewport();
  if (curMobile !== lastMobileState) {
    lastMobileState = curMobile;
    const insp = document.getElementById("inspector");
    const backdrop = document.getElementById("inspectorBackdrop");
    const drawer = document.getElementById("headerDrawer");
    if (insp) insp.classList.remove("open", "desktop-hidden");
    if (backdrop) backdrop.classList.remove("open");
    if (drawer) drawer.classList.remove("open");
    updateInspectorToggleLabel();
    renderSequence();
  }
});
updateInspectorToggleLabel();

document.getElementById("showItems").addEventListener("change", renderSequence);
document.getElementById("showLocs").addEventListener("change", renderSequence);
document.getElementById("showTopic").addEventListener("change", renderSequence);
renderAll();
</script>
</body>
</html>
